name: Release
on:
  workflow_dispatch:
    inputs:
      level:
        description: Release level
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch
          - version
      version:
        description: Version to release (if level is "version"), for example 1.0.0
        required: false
        type: string
permissions:
  actions: write
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
      - name: Select release tag
        id: release
        shell: bash
        env:
          LEVEL: ${{ inputs.level }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$LEVEL" == "version" ]]; then
            tag="v${VERSION_INPUT#v}"
          else
            latest="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
            latest="${latest:-v0.0.0}"
            [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "invalid latest tag: $latest" >&2; exit 1; }
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            case "$LEVEL" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "invalid release level: $LEVEL" >&2; exit 1 ;;
            esac
            tag="v${major}.${minor}.${patch}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release version: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Promote changelog and create tag
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          date="$(date -u +%Y-%m-%d)"
          if ! grep -qF "## ${TAG} - " CHANGELOG.md; then
            awk -v tag="$TAG" -v date="$date" '
              BEGIN { in_unreleased=0; count=0; promoted=0 }
              /^## Unreleased$/ { print; print ""; in_unreleased=1; next }
              in_unreleased && /^## / {
                print "## " tag " - " date; print ""
                for (i = 1; i <= count; i++) print entries[i]
                print ""; in_unreleased=0; promoted=1
              }
              in_unreleased && /^- / { entries[++count]=$0; next }
              in_unreleased { next }
              { print }
              END {
                if (in_unreleased) {
                  print "## " tag " - " date; print ""
                  for (i = 1; i <= count; i++) print entries[i]
                  promoted=1
                }
                if (!promoted) exit 1
              }
            ' CHANGELOG.md > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add CHANGELOG.md
            git diff --cached --quiet || git commit -m "Prepare ${TAG} release"
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Finalize release
        run: gh workflow run finalize-release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.release.outputs.tag }}" -f tag="${{ steps.release.outputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
