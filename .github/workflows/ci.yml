name: CI
on:
  # Pushes are only built for the default branch. Branch coverage comes from the
  # pull_request trigger below, which attaches its verdict to the pull request's
  # head SHA even when that commit is empty or only touches markdown.
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
  # No paths filter here on purpose: every head SHA of a pull request that is up
  # for review must carry a CI verdict before it can be merged.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Draft pull requests are skipped so the empty `[skip ci]` commit that opens
    # a draft does not burn a run; the ready_for_review event checks the head SHA
    # once the pull request is actually up for review.
    if: >-
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: webui
      - run: pnpm run build
        working-directory: webui
      - run: pnpm run lint
        working-directory: webui
      - run: pnpm test
        working-directory: webui
      # The race detector runs here rather than in a second step so the suite
      # stays race-clean without paying for the same tests twice. Windows keeps
      # the plain run below, where the detector needs a C toolchain.
      - run: go test -race ./...
      - run: go vet ./...
      # macOS has no runner here, so cross-compile its process handling to keep
      # it from breaking unnoticed. Windows has its own job below.
      - run: GOOS=darwin go vet ./...
      # Everything behind the production tag -- the webui/dist embed, the SPA
      # file server, the no-op StartFrontend -- is invisible to the untagged
      # steps above, and it is what a released binary actually ships. The embed
      # needs the frontend build from the pnpm step above, so check that its
      # output is there first: a missing webui/dist would otherwise surface as
      # an opaque "pattern dist/*: no matching files found".
      - name: Check the frontend build output the production embed needs
        run: |
          if [ ! -f webui/dist/index.html ]; then
            echo "webui/dist/index.html is missing: run pnpm run build in webui/ before the production-tagged steps" >&2
            exit 1
          fi
      - run: go vet -tags production ./...
      - run: go test -tags production ./...

  test-windows:
    # Draft pull requests are skipped so the empty `[skip ci]` commit that opens
    # a draft does not burn a run; the ready_for_review event checks the head SHA
    # once the pull request is actually up for review.
    if: >-
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      # The default build needs no generated web assets, since the webui/dist
      # embed is behind the production tag. The dependencies are still needed
      # because the development web UI test starts Vite, which is one of the
      # cases that exercises the Windows process handling under test here.
      - run: pnpm install --frozen-lockfile
        working-directory: webui
      - run: go test ./...
      - run: go vet ./...
