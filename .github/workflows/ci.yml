name: CI
on:
  push:
jobs:
  test:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run build
        working-directory: web
      - run: pnpm run lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
      # macOS has no runner here, so cross-compile its process handling to keep
      # it from breaking unnoticed. Windows has its own job below.
      - run: GOOS=darwin go vet ./...

  test-windows:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The default build needs no generated web assets, since the web/dist
      # embed is behind the production tag. The dependencies are still needed
      # because the development web UI test starts Vite, which is one of the
      # cases that exercises the Windows process handling under test here.
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: go test ./...
      - run: go vet ./...
