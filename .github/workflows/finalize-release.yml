name: Finalize release
# Only ever dispatched from the default branch, with the release tag as an
# input; release.yml does this after it creates the tag. A run on a tag ref
# would save its caches where no later release can read them, because a run
# restores caches only from its own ref and the default branch, and every
# release has a new tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the run ref and release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]] || { echo "run finalize from $DEFAULT_BRANCH with the tag as an input, not from $GITHUB_REF" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag: $TAG" >&2; exit 1; }
      # The run ref is the default branch, but the release is built from the
      # tag's own content.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          # setup-go's own cache is keyed only on go.sum with no restore-keys, so
          # a dependency bump is a fully cold build and a stable go.sum never
          # refreshes what was stored. The step below caches the same directories
          # under a key that falls back, so it is turned off here rather than
          # having both save the same paths.
          cache: false
      # Its own build cache prefix, because the archive build below
      # cross-compiles for six GOOS/GOARCH pairs and shares almost no compiled
      # object with a native CI run. Modules come from the cache all jobs
      # share, so the ones the Release job already downloaded are reused here.
      - uses: ./.github/actions/go-cache
        with:
          key-prefix: release-cross-compile
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: webui
      - run: pnpm run build
        working-directory: webui
      - run: go test ./...
      - run: go vet ./...
      - name: Build archives and installer
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${TAG#v}"
          for target in "linux amd64 tar.gz" "linux arm64 tar.gz" "darwin amd64 tar.gz" "darwin arm64 tar.gz" "windows amd64 zip" "windows arm64 zip"; do
            read -r goos goarch extension <<< "$target"
            name="glorp_${version}_${goos}_${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -tags production -ldflags "-X main.version=$version" -o "dist/$name/glorp" .
            if [[ "$goos" == "windows" ]]; then
              mv "dist/$name/glorp" "dist/$name/glorp.exe"
              (cd "dist/$name" && zip -q -r "../${name}.${extension}" glorp.exe)
            else
              tar -czf "dist/${name}.${extension}" -C "dist/$name" glorp
            fi
          done
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          extract_section() {
            awk -v heading="$1" '
              index($0, heading) == 1 { in_section=1; next }
              in_section && /^## / { exit }
              in_section { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d'
          }
          extract_section "## $TAG -" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            extract_section "## Unreleased" > release-notes.md
          fi
          [[ -s release-notes.md ]] || { echo "no changelog entry found for $TAG" >&2; exit 1; }
      - name: Create GitHub release
        run: gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/install.sh dist/install.ps1 --notes-file release-notes.md
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
