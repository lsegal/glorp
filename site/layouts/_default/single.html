<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{- $description := .Params.description | default (printf "A high-level guide to %s for glorp." .Title) -}}
    {{- $ogimage := .Params.ogimage | default "images/og-home.png" -}}
    <meta name="description" content="{{ $description }}">
    <meta name="theme-color" content="#24245c">
    <title>{{ .Title }} · glorp</title>
    <link rel="icon" type="image/svg" href="{{ "assets/glorp-logo.svg" | relURL }}">
    <link rel="stylesheet" href="{{ "style.css" | relURL }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ site.Title }}">
    <meta property="og:title" content="{{ .Title }} · glorp">
    <meta property="og:description" content="{{ $description }}">
    <meta property="og:image" content="{{ $ogimage | absURL }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ .Title }} · glorp">
    <meta name="twitter:description" content="{{ $description }}">
    <meta name="twitter:image" content="{{ $ogimage | absURL }}">
  </head>
  <body class="skill-page">
    <header class="site-header">
      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="glorp home"><img src="{{ "assets/glorp-logo.svg" | relURL }}" alt=""><span>glorp</span></a>
      <nav class="site-nav" aria-label="Primary navigation"><a class="nav-skill" href="{{ "skills/gh-fix/" | relURL }}">/gh-fix</a><a class="nav-skill" href="{{ "skills/gh-discuss/" | relURL }}">/gh-discuss</a><a class="repo-link" href="https://github.com/lsegal/glorp">View on GitHub</a></nav>
    </header>
    <main class="skill-doc">{{ .Content }}</main>
    <footer>Part of <a href="https://github.com/lsegal/glorp">glorp on GitHub</a>.</footer>
  </body>
</html>
