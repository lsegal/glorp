<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A high-level guide to {{ .Title }} for glorp.">
    <meta name="theme-color" content="#24245c">
    <title>{{ .Title }} · glorp</title>
    <link rel="icon" type="image/svg" href="{{ "assets/glorp-logo.svg" | relURL }}">

      <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="glorp home"><img src="{{ "assets/glorp-logo.svg" | relURL }}" alt=""><span>glorp</span></a>

    <main class="skill-doc">{{ .Content }}</main>

  </body>
