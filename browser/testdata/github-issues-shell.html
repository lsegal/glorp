<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Issues · lsegal/glorp</title></head>
<body>
<!-- The page shell GitHub serves before the client-rendered issues list draws.
     Every repository page carries one of these hidden blankslates per lazily
     loaded fragment, revealed only when the fragment fails, so a page with no
     list yet still answers a document-wide search for an empty-state marker. -->
<include-fragment src="/in-product-messaging/banner" class="is-error">
  <div data-show-on-forbidden-error hidden>
    <div class="blankslate blankslate-spacious">
      <h3 class="blankslate-heading">Uh oh!</h3>
      <p>There was an error while loading. Please reload this page.</p>
    </div>
  </div>
</include-fragment>
<include-fragment src="/lsegal/glorp/issues/counts" class="is-error">
  <div data-show-on-forbidden-error hidden>
    <div class="blankslate blankslate-spacious">
      <h3 class="blankslate-heading">Uh oh!</h3>
      <p>There was an error while loading. Please reload this page.</p>
    </div>
  </div>
</include-fragment>
<react-app app-name="issues-react" data-ssr="false"></react-app>
<footer class="footer"><h2 class="sr-only">Footer</h2><p>&copy; 2026 GitHub, Inc.</p></footer>
</body>
</html>
