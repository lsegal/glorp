<!DOCTYPE html>
<!--
  A repository issues page as GitHub serves it to a signed-out session, with
  the same "@me" query glorp's default filter carries. GitHub renders it
  successfully and honestly empty: "@me" resolves to nobody, so nothing
  matches. The extractor is right to call this a recognised, empty list, which
  is exactly why the sign-in probe has to be the thing that tells the user
  their profile is logged out (issue #402).

  Trimmed from the live page. The parts that matter are kept verbatim: the
  <body> class, the empty <meta name="user-login"> content GitHub emits when
  there is no viewer, the /login links, and the empty-state blankslate.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Issues &middot; lsegal/glorp &middot; GitHub</title>
  <meta name="user-login" content="">
  <meta name="octolytics-actor-login" content="">
</head>
<body class="logged-out env-production page-responsive">
  <header>
    <a href="/login?return_to=https%3A%2F%2Fgithub.com%2Flsegal%2Fglorp%2Fissues">Sign in</a>
    <a href="/signup">Sign up</a>
  </header>
  <main>
    <div data-listview-component="items-list">
      <div class="blankslate">
        <h3>No results</h3>
        <p>Try adjusting your search filters.</p>
      </div>
    </div>
  </main>
</body>
</html>
