<!DOCTYPE html>
<html lang="en">
  <body>
    <div data-testid="memex-app">
      <div role="grid" aria-label="Board">
        <div role="row" data-testid="TableHeader">
          <div role="columnheader" data-testid="TableHeader-Title">Title</div>
          <div role="columnheader" data-testid="TableHeader-Status">Status</div>
        </div>

        <div role="row" data-testid="TableRow" data-row-id="PVTI_1">
          <div role="gridcell" data-testid="TableCell-Title">
            <a href="/lsegal/glorp/issues/378">Browser mode: project board extraction</a>
          </div>
          <div role="gridcell" data-testid="TableCell-Status">
            <span class="Truncate-text">In Progress</span>
          </div>
        </div>

        <div role="row" data-testid="TableRow" data-row-id="PVTI_2">
          <div role="gridcell" data-testid="TableCell-Title">
            <a href="https://github.com/lsegal/zvidlib/issues/42">Absolute link issue</a>
          </div>
          <div role="gridcell" data-testid="TableCell-Status">
            <span class="Truncate-text">Todo</span>
          </div>
        </div>

        <!-- A draft card has no issue behind it and must not dispatch. -->
        <div role="row" data-testid="TableRow" data-row-id="PVTI_3">
          <div role="gridcell" data-testid="TableCell-Title">
            <span>Untitled draft</span>
          </div>
          <div role="gridcell" data-testid="TableCell-Status">
            <span class="Truncate-text">Todo</span>
          </div>
        </div>

        <!-- A pull request on the board is not an issue. -->
        <div role="row" data-testid="TableRow" data-row-id="PVTI_4">
          <div role="gridcell" data-testid="TableCell-Title">
            <a href="/lsegal/glorp/pull/389">Browser mode pull request</a>
          </div>
          <div role="gridcell" data-testid="TableCell-Status">
            <span class="Truncate-text">In Progress</span>
          </div>
        </div>

        <!-- The Status cell renders as an icon here, so the value is only in the label. -->
        <div role="row" data-testid="TableRow" data-row-id="PVTI_5">
          <div role="gridcell" data-testid="TableCell-Title">
            <a href="/lsegal/glorp/issues/377">Browser mode: issue-list extraction</a>
          </div>
          <div role="gridcell" data-testid="TableCell-Status" aria-label="Status: Done">
            <svg aria-hidden="true"></svg>
          </div>
        </div>

        <!-- An item that has never been given a status. -->
        <div role="row" data-testid="TableRow" data-row-id="PVTI_6">
          <div role="gridcell" data-testid="TableCell-Title">
            <a href="/lsegal/glorp/issues/276">Remove the remaining GraphQL calls</a>
          </div>
          <div role="gridcell" data-testid="TableCell-Status"></div>
        </div>
      </div>
    </div>
  </body>
</html>
